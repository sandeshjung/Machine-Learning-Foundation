[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlf-utils"
version = "0.1.0"
description = "Shared helpers for the Machine Learning Foundation notebooks"
requires-python = ">=3.9"
# Kept minimal so installing on Colab never reinstalls torch; torch/torchvision/graphviz
# are imported lazily by the helpers that need them.
dependencies = ["numpy", "matplotlib"]

[tool.setuptools]
packages = ["mlf_utils"]
